services:
  consul:
    image: hashicorp/consul:1.21
    container_name: dev-consul
    ports:
      - 8500:8500
      # - 8600:8600/tcp
      # - 8600:8600/udp
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"
    volumes:
      - consul_store:/consul/data
    # provera healtha baze na svakih 5 sec
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 5s
      timeout: 3s
      retries: 5

  server: 
    build: .
    container_name: central-config-server
    restart: always
    ports:
      - "8000:8000" 
    depends_on:
      consul:
        condition: service_healthy # server ceka da baza bude healthy
    environment:
      - CONSUL_ADDRESS=consul:8500

volumes:
  consul_store: